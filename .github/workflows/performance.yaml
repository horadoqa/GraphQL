name: GraphQL Performance Tests

on:
  workflow_dispatch:

jobs:
  performance:
    name: GraphQL Performance
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # Instalar k6
      # ==========================================================

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # ==========================================================
      # Subir PostgreSQL + GraphQL
      # ==========================================================

      - name: Start application
        working-directory: horadoqa
        run: |
          docker compose up -d --build

      # ==========================================================
      # Status dos containers
      # ==========================================================

      - name: Docker status
        working-directory: horadoqa
        run: |
          docker compose ps

      # ==========================================================
      # Aguardar API
      # ==========================================================

      - name: Wait for GraphQL API
        run: |
          echo "Aguardando GraphQL API..."

          for i in {1..30}; do

            echo "Tentativa $i/30..."

            if curl --fail \
              --silent \
              --show-error \
              --max-time 5 \
              -X POST \
              http://localhost:4000 \
              -H "Content-Type: application/json" \
              -d '{"query":"{ users { id } }"}' \
              > /tmp/graphql-response.json; then

              echo "GraphQL API disponível!"

              cat /tmp/graphql-response.json

              exit 0
            fi

            echo "API ainda não está disponível."

            sleep 2

          done

          echo "GraphQL API não iniciou."

          cd horadoqa

          docker compose ps
          docker compose logs

          exit 1

      # ==========================================================
      # Health Check
      # ==========================================================

      - name: GraphQL Health Check
        run: |
          curl --fail \
            --silent \
            --show-error \
            -X POST \
            http://localhost:4000 \
            -H "Content-Type: application/json" \
            -d '{
              "query": "{ users { id name email administrador } }"
            }'

      # ==========================================================
      # Criar usuários
      # ==========================================================

      - name: k6 - Create Users
        run: |
          k6 run horadoqa/tests/k6/create-users.js

      # ==========================================================
      # Ler usuários
      # ==========================================================

      - name: k6 - Get Users
        run: |
          k6 run horadoqa/tests/k6/get-users.js

      # ==========================================================
      # Logs se houver falha
      # ==========================================================

      - name: Docker logs
        if: failure()
        working-directory: horadoqa
        run: |
          echo "===== API ====="
          docker compose logs api

          echo "===== DATABASE ====="
          docker compose logs db

      # ==========================================================
      # Finalizar
      # ==========================================================

      - name: Stop application
        if: always()
        working-directory: horadoqa
        run: |
          docker compose down -v
